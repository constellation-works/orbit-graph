schemaVersion: 2
kind: Activity
metadata:
  name: graph_history_sync
spec:
  type: deterministic
  description: Synchronize bounded first-parent graph history through the graph plugin.
  input_schema_json:
    type: object
  action: plugin.tool_call
  config:
    tool: orbit.graph.maintain
    # No branch: the plugin syncs its configured `[plugins.graph] branch`
    # (default main), which Orbit sends to the backend as context.config.
    # Orbit does not render {{config.*}} templates in tool-call input.
    input:
      operation: history_sync
