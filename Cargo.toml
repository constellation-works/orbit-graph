[workspace]
members = [
  "crates/orbit-graph",
  "crates/orbit-graph-cli",
  "crates/orbit-graph-explorer",
]
resolver = "3"

[workspace.package]
version = "0.9.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/constellation-works/orbit-graph"

# Versions shared by more than one workspace member. Single-consumer
# dependencies stay in the crate that needs them.
[workspace.dependencies]
git2 = { version = "0.20", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
