[workspace]
members = [
  "crates/orbit-graph",
  "crates/orbit-graph-cli",
  "crates/orbit-graph-extract",
  "crates/orbit-graph-explorer",
]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/constellation-works/orbit-graph"

# Versions shared by more than one workspace member (STD-02 §R9). Single-consumer
# dependencies stay in the crate that needs them.
[workspace.dependencies]
blake3 = "1"
git2 = { version = "0.21", default-features = false }
libc = "0.2"
orbit-graph = { path = "crates/orbit-graph", version = "0.10.0" }
orbit-graph-extract = { path = "crates/orbit-graph-extract", version = "0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
toml = "1.1"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
