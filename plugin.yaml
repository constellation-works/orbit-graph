schemaVersion: 2
kind: Plugin
metadata:
  name: graph
  version: 0.10.0
  description: Leakage-safe file and symbol recommendations from verified change history.
  publisher: constellation-works
  origin: orbit
  homepage: https://github.com/constellation-works/orbit-graph
spec:
  requires:
    orbit: ">=0.23.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    programs: [git, orbit]
  backend:
    type: exec
    command: bin/orbit-graph
    timeout_ms: 120000
    sandbox: default
  permissions:
    fs:
      read: ["{{workspace}}"]
      write: ["{{workspace}}/.orbit-graph", "{{plugin_state}}"]
    network: none
    orbit_tools:
      - orbit.task.show
      - orbit.search
      - orbit.workspace.list
      - orbit.workflow.run.show
  tools:
    - name: version
      description: Report deterministic crate and index contract versions.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/version.request.json}
      output_schema: {$ref: schemas/version.response.json}
    - name: status
      description: Report recommendation-history freshness and index versions.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/status.request.json}
      output_schema: {$ref: schemas/status.response.json}
    - name: recommend
      description: Recommend repository files or symbols from verified change history.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/recommend.request.json}
      output_schema: {$ref: schemas/recommend.response.json}
      cli:
        positional: [query]
    - name: maintain
      description: Import or synchronize bounded verified change history, or refresh the code-graph index.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: {$ref: schemas/maintain.request.json}
      output_schema: {$ref: schemas/maintain.response.json}
    - name: search
      description: "Full-text search over indexed symbols, string literals, and config keys. Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/search.request.json}
      output_schema: {$ref: schemas/search.response.json}
      cli:
        positional: [query]
    - name: show
      description: "Show one node's metadata and a bounded slice of its source. Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/show.request.json}
      output_schema: {$ref: schemas/show.response.json}
      cli:
        positional: [selector]
    - name: refs
      description: "Inbound references and structural relations of a symbol. Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/refs.request.json}
      output_schema: {$ref: schemas/refs.response.json}
      cli:
        positional: [selector]
    - name: callees
      description: "Outbound call edges from a symbol. Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/callees.request.json}
      output_schema: {$ref: schemas/callees.response.json}
      cli:
        positional: [selector]
    - name: impact
      description: "Bounded blast radius around a symbol: what it reaches and what reaches it. Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/impact.request.json}
      output_schema: {$ref: schemas/impact.response.json}
      cli:
        positional: [selector]
    - name: trace
      description: "Call tree rooted at a command handler. Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/trace.request.json}
      output_schema: {$ref: schemas/trace.response.json}
      cli:
        positional: [command]
    - name: deps
      description: "Outbound source-level import edges of a file or directory (not Cargo crate edges). Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/deps.request.json}
      output_schema: {$ref: schemas/deps.response.json}
      cli:
        positional: [selector]
    - name: overview
      description: "Summarize indexed files, symbols, and languages for the repository or a scope. Reads the index graph_sync publishes."
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: {$ref: schemas/overview.request.json}
      output_schema: {$ref: schemas/overview.response.json}
      cli:
        positional: [selector]
  definitions:
    activities: [definitions/activities/*.yaml]
    jobs: [definitions/jobs/*.yaml]
    routines: [definitions/routines/*.yaml]
  skills: [skills/recommendations]
  config:
    schema: schemas/config.json
    defaults:
      index_dir: .orbit-graph
      branch: main
  web:
    panels:
      - id: version
        title: Graph versions
        source: tool:version
        render: kv
        group: diagnostics
  tests: [tests/conformance/*.yaml]
