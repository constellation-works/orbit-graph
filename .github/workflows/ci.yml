name: CI

on:
  pull_request:
  push:
    branches: [agent-main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-latest
    # Wall-clock ceilings for every job (STD-03 §R22); a hung test is ended
    # sooner by the nextest slow-timeout in .config/nextest.toml.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.89.0
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Pinned release, verified by its SHA-256 before it runs (STD-05 §R23).
      # Keep the version in step with CARGO_NEXTEST_VERSION in the Makefile.
      - name: Download pinned cargo-nextest release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cargo-nextest.tar.gz" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            'a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52' \
            "$RUNNER_TEMP/cargo-nextest.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/cargo-nextest.tar.gz" -C "$RUNNER_TEMP" cargo-nextest
          install -m 755 "$RUNNER_TEMP/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version
      - run: sh docs/standards/check.sh
      # Source-only repository gates (ARCHITECTURE.md) and their seeded-
      # violation self-test.
      - run: scripts/check-dependency-direction.sh
      - run: scripts/check-terminal-guard.sh
      - run: scripts/check-orphan-modules.sh
      - run: scripts/test-repo-gates.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked --no-tests=fail
      # nextest does not run doctests.
      - run: cargo test --workspace --doc --locked
      - run: cargo nextest run -p orbit-graph-cli --test plugin_integration --locked --no-tests=fail
      # Launcher/installer pins, goldens, manifest versions, released-contract
      # ledger, and schema property descriptions agree with the crate.
      - run: cargo nextest run -p orbit-graph-cli --test plugin_contract --locked --no-tests=fail
      - run: cargo build --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Job names carry no tool versions: they are the required status checks on
  # agent-main, so a version in the name would block every PR after a bump.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.89.0
        with:
          toolchain: 1.89.0
      # Pinned release, verified by its SHA-256 before it runs (STD-05 §R23).
      # Keep the version in step with CARGO_DENY_VERSION in the Makefile.
      - name: Download pinned cargo-deny release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' \
            'f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af' \
            "$RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 \
            cargo-deny-0.19.9-x86_64-unknown-linux-musl/cargo-deny
          install -m 755 "$RUNNER_TEMP/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version
      # Advisories, yanked crates, licenses and sources against deny.toml
      # (STD-02 §R23, STD-05 §R24).
      - run: cargo deny --locked check

  plugin-conformance:
    name: Plugin conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.89.0
        with:
          toolchain: 1.89.0
      - run: cargo build -p orbit-graph-cli --locked
      - name: Download pinned Orbit release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/orbit.tar.gz" \
            https://github.com/constellation-works/orbit/releases/download/v0.24.0/orbit-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            '78a8ecf2dd19e61c61b7ec97ebd60206a46b7e93035b85310d152cc7cbeabace' \
            "$RUNNER_TEMP/orbit.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/orbit.tar.gz" -C "$RUNNER_TEMP" orbit
          "$RUNNER_TEMP/orbit" --version
      - name: Initialize isolated conformance workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/graph-conformance"
          git -C "$RUNNER_TEMP/graph-conformance" init -b main
          cd "$RUNNER_TEMP/graph-conformance"
          "$RUNNER_TEMP/orbit" workspace init --name graph-conformance --root "$RUNNER_TEMP/graph-conformance/.orbit"
      # The manifest claims `origin: orbit`, which Orbit honours only for a
      # verified constellation-works source; --first-party checks this
      # checkout as it would be after `orbit plugin add git+…`.
      - name: Validate and test plugin
        shell: bash
        run: |
          "$RUNNER_TEMP/orbit" plugin validate --first-party .
          PATH="$PWD/target/debug:$PATH" "$RUNNER_TEMP/orbit" plugin test --first-party \
            --root "$RUNNER_TEMP/graph-conformance/.orbit" --workspace graph-conformance .

  portability:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The gate scripts run under macOS's BSD userland and bash 3.2 too.
      - if: runner.os == 'macOS'
        run: scripts/test-repo-gates.sh
      # Pinned releases, verified by their SHA-256 before they run
      # (STD-05 §R23). Keep the version in step with CARGO_NEXTEST_VERSION in
      # the Makefile.
      - name: Download pinned cargo-nextest release
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            target=universal-apple-darwin
            sha256=905fa8b5150caa012b182f6e1b9234c62aed8290883f848e7416f974faada4ce
          else
            target=x86_64-unknown-linux-gnu
            sha256=a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52
          fi
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cargo-nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-$target.tar.gz"
          printf '%s  %s\n' "$sha256" "$RUNNER_TEMP/cargo-nextest.tar.gz" | shasum -a 256 --check -
          tar -xzf "$RUNNER_TEMP/cargo-nextest.tar.gz" -C "$RUNNER_TEMP" cargo-nextest
          install -m 755 "$RUNNER_TEMP/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version
      - run: cargo nextest run --workspace --locked --no-tests=fail
      - run: cargo test --workspace --doc --locked
