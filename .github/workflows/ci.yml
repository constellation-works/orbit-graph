name: CI

on:
  pull_request:
  push:
    branches: [agent-main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.89.0
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sh docs/standards/check.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p orbit-graph-cli --test plugin_integration --locked
      # Launcher/installer pins, goldens, manifest versions, released-contract
      # ledger, and schema property descriptions agree with the crate.
      - run: cargo test -p orbit-graph-cli --test plugin_contract --locked
      - run: cargo build --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  plugin-conformance:
    name: Plugin conformance (Orbit v0.24.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.89.0
        with:
          toolchain: 1.89.0
      - run: cargo build -p orbit-graph-cli --locked
      - name: Download pinned Orbit release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/orbit.tar.gz" \
            https://github.com/constellation-works/orbit/releases/download/v0.24.0/orbit-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            '78a8ecf2dd19e61c61b7ec97ebd60206a46b7e93035b85310d152cc7cbeabace' \
            "$RUNNER_TEMP/orbit.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/orbit.tar.gz" -C "$RUNNER_TEMP" orbit
          "$RUNNER_TEMP/orbit" --version
      - name: Initialize isolated conformance workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/graph-conformance"
          git -C "$RUNNER_TEMP/graph-conformance" init -b main
          cd "$RUNNER_TEMP/graph-conformance"
          "$RUNNER_TEMP/orbit" workspace init --name graph-conformance --root "$RUNNER_TEMP/graph-conformance/.orbit"
      # The manifest claims `origin: orbit`, which Orbit honours only for a
      # verified constellation-works source; --first-party checks this
      # checkout as it would be after `orbit plugin add git+…`.
      - name: Validate and test plugin
        shell: bash
        run: |
          "$RUNNER_TEMP/orbit" plugin validate --first-party .
          PATH="$PWD/target/debug:$PATH" "$RUNNER_TEMP/orbit" plugin test --first-party \
            --root "$RUNNER_TEMP/graph-conformance/.orbit" --workspace graph-conformance .

  portability:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
