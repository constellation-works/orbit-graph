[package]
name = "orbit-graph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal JSON command-line interface for the orbit-graph index"
keywords = ["code-graph", "cli", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orbit-graph"
path = "src/main.rs"
# The executable and the library share the `orbit_graph` doc output path, so
# `cargo doc --workspace` would have the binary overwrite the library's pages.
doc = false

[lints]
workspace = true

[dependencies]
blake3.workspace = true
# Without clap's default `color` feature (and without `wrap_help`) clap never
# queries the terminal itself; the output sink is the one place that does
# (STD-01 §R17).
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
fs2.workspace = true
git2.workspace = true
libc.workspace = true
orbit-graph.workspace = true
orbit-graph-changes.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# SHA-256 of a non-GitHub origin URL, the digest Orbit names such a
# repository by (`git:<hex>`), so a delivery answer's identity is compared
# exactly rather than by shape.
sha2 = "0.10"
thiserror.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "=1.13.3"
unicode-width = "0.2"

[dev-dependencies]
serde_json.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
