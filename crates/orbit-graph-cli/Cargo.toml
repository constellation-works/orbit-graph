[package]
name = "orbit-graph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal JSON command-line interface for the orbit-graph index"
keywords = ["code-graph", "cli", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orbit-graph"
path = "src/main.rs"
# The executable and the library share the `orbit_graph` doc output path, so
# `cargo doc --workspace` would have the binary overwrite the library's pages.
doc = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
git2.workspace = true
libc.workspace = true
orbit-graph = { path = "../orbit-graph", version = "0.9.2" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "=1.12.0"
unicode-width = "0.2"

[dev-dependencies]
serde_json.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true
