          type: integer
        history_schema_version:
          description: SQLite schema version of the change-history index.
          type: integer
        plugin_schema_version:
          description: Version of the plugin request/response contract; requests must send the same schema_version.
          type: integer
        store_schema_version:
          description: SQLite schema version of the code-graph index.
          type: integer
      required:
      - crate_version
      - extractor_version
      - store_schema_version
      - history_schema_version
      - plugin_schema_version
