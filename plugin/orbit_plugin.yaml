  - description: Changed symbols between two revisions or in the working tree, with labelled callers, entry points, and candidate tests. Call after implementing, before review, and to pick tests. Indexes both sides itself (about 12 s cold, cached under plugin state) within budget_ms.
    execution_kind: read_only
    input_schema:
      additionalProperties: false
      properties:
        base:
          description: 'Base revision (branch, tag, or commit). Omitted: the merge base of HEAD and the branch the work lands on (its upstream, else origin/HEAD, else main, else master); the choice is reported in result.default_base. Nothing is fetched.'
          minLength: 1
          type: string
        budget_ms:
          default: 90000
          description: 'Wall-clock budget for the whole call, indexing included, in milliseconds; 1000-110000, default 90000, below the 120 s tool timeout. When it runs out the call returns complete: false with the reason instead of hanging.'
          maximum: 110000
          minimum: 1000
          type: integer
        confidence:
          default: same_module
          description: 'Minimum resolution confidence of every hop: exact, import_resolved, same_module, or fuzzy_name (name-only matches). Default same_module.'
          enum:
          - exact
          - import_resolved
          - same_module
          - fuzzy_name
          type: string
        depth:
          default: 3
          description: Maximum hops from a changed symbol to a caller or entry point; 1-10, default 3.
          maximum: 10
          minimum: 1
          type: integer
        head:
          description: 'Head revision. Omitted: the working tree, including staged, unstaged, and untracked (not ignored) files, which is never cached. Requires base.'
          minLength: 1
          type: string
        language:
          description: Keep only changed symbols whose file is in this language (for example rust).
          minLength: 1
          type: string
        max_callers:
          default: 5
          description: Maximum callers kept per changed symbol, strongest evidence first; 1-500, default 5.
          maximum: 500
          minimum: 1
          type: integer
        max_entry_points:
          default: 3
          description: Maximum entry points kept per changed symbol, nearest first; 1-100, default 3.
          maximum: 100
          minimum: 1
          type: integer
        max_symbols:
          default: 25
          description: Maximum changed symbols analysed, in changed-symbol order; 1-1000, default 25. The rest are listed in result.not_analysed.
          maximum: 1000
          minimum: 1
          type: integer
        max_tests:
          default: 5
          description: Maximum candidate tests kept per changed symbol, strongest source first; 1-500, default 5.
          maximum: 500
          minimum: 1
          type: integer
        node_cap:
          default: 200
          description: Maximum nodes, and paths, one traversal may return; 1-2000, default 200.
          maximum: 2000
          minimum: 1
          type: integer
        query_budget_ms:
          default: 5000
          description: Wall-clock budget of one traversal in milliseconds; 100-60000, default 5000. Capped at the time left in budget_ms.
          maximum: 60000
          minimum: 100
          type: integer
        repository:
          description: Absolute path of the Git repository to analyse. Defaults to the caller's workspace root; never inferred from the tool cwd.
          minLength: 1
          type: string
        schema_version:
          const: 1
          description: Request contract version; must be 1 when present. An omitted version is read as version 1, the only one there has been.
          type: integer
        scope:
          description: Keep only changed symbols whose path starts with this prefix.
          minLength: 1
          type: string
        symbols:
          description: Changed-symbol selectors (symbol:<path>#<name>:<kind>) to analyse; default every changed symbol up to max_symbols. A selector that matches no changed symbol is listed in result.unmatched_selection.
          items:
            minLength: 1
            type: string
          type: array
      type: object
