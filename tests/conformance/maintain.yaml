# See status.yaml: the conformance workspace is an empty non-Git directory.
schemaVersion: 1
kind: PluginTest
tests:
  - name: maintain_history_sync_requires_a_git_repository
    tool: maintain
    input:
      schema_version: 1
      operation: history_sync
      repository: "{{workspace}}"
      limit: 10
    expect:
      error:
        code: repository_unavailable
  - name: maintain_history_sync_bounds_its_limit
    tool: maintain
    input:
      schema_version: 1
      operation: history_sync
      repository: "{{workspace}}"
      limit: 1001
    expect:
      error:
        code: invalid_request
  - name: maintain_import_requires_a_delivery
    tool: maintain
    input:
      schema_version: 1
      operation: import
      repository: "{{workspace}}"
    expect:
      error:
        code: invalid_request
  - name: maintain_rejects_an_unknown_operation
    tool: maintain
    input:
      schema_version: 1
      operation: rebuild
      repository: "{{workspace}}"
    expect:
      error:
        code: invalid_request
  # graph_sync success is not expressible here for the same reason: it needs a
  # Git checkout to index. The real-binary integration test
  # graph_sync_publishes_structure_that_recommend_applies_at_its_revision
  # covers the published path.
  - name: maintain_graph_sync_requires_a_git_repository
    tool: maintain
    input:
      schema_version: 1
      operation: graph_sync
      repository: "{{workspace}}"
    expect:
      error:
        code: repository_unavailable
  - name: maintain_graph_sync_bounds_its_budget
    tool: maintain
    input:
      schema_version: 1
      operation: graph_sync
      repository: "{{workspace}}"
      budget_ms: 999
    expect:
      error:
        code: invalid_request
  - name: maintain_full_applies_only_to_graph_sync
    tool: maintain
    input:
      schema_version: 1
      operation: history_sync
      repository: "{{workspace}}"
      full: true
    expect:
      error:
        code: invalid_request
  # STD-01 R29: a field the operation does not read is refused, not dropped.
  - name: maintain_history_sync_refuses_fields_it_does_not_read
    tool: maintain
    input:
      schema_version: 1
      operation: history_sync
      repository: "{{workspace}}"
      run_ids: [jrun-1]
      workspace: ws_graph
    expect:
      error:
        code: invalid_request
  - name: maintain_import_refuses_a_limit
    tool: maintain
    input:
      schema_version: 1
      operation: import
      repository: "{{workspace}}"
      limit: 10
    expect:
      error:
        code: invalid_request
  - name: maintain_orbit_sync_refuses_a_delivery
    tool: maintain
    input:
      schema_version: 1
      operation: orbit_sync
      repository: "{{workspace}}"
      workspace: ws_graph
      delivery: {}
    expect:
      error:
        code: invalid_request
